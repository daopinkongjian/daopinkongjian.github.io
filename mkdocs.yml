# ============================================================
# 站点信息
# ============================================================
site_name: 道品空间
site_url: https://daopin.space

# ============================================================
# 导航目录
# ============================================================
nav:
  - 首页: 
    - 学修项目: index.md
    - 觉观禅简介: projects/jueguan-introduction.md
    - 念住禅简介: projects/nianzhu-introduction.md
    - 道品禅简介: projects/daopin-introduction.md
    - 止观禅简介: projects/zhiguan-introduction.md
    - 闭关营简介: projects/biguan-introduction.md
    - 禅宗修道班简介: projects/chanzongxiudaoban-introduction.md
    - 禅法专科班简介: projects/chanfazhuankeban-introduction.md
  - 资料汇编工作:
    - 资料汇编工作方法: literature-extract-collect/literature-extract-collect.md
  - 义脉树枝图生成器↗: tools/yimaishuzhitu.html

# ============================================================
# 主题设置
# ============================================================
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.expand
  language: zh
  font:
    text: Fira Sans
    code: Fira Mono
  palette:
    - scheme: default
      primary: white
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to light mode

